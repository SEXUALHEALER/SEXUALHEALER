<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Стиль шрифта: используем стандартный рукописный шрифт, чтобы избежать сбоя загрузки внешних шрифтов -->
    <style>
      .hand { font-family: 'Segoe Script', 'Brush Script MT', 'Comic Sans MS', cursive; }
    </style>

    <!-- Градиент: белый → нежно-голубой -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#eef6ff"/>
      <stop offset="75%"  stop-color="#cfe6fb"/>
      <stop offset="100%" stop-color="#a9d3f2"/>
    </linearGradient>

    <!-- Мягкое свечение -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Чёрный фон -->
  <rect width="100%" height="100%" fill="#080808" rx="20"/>

  <!-- Наклонный текст -->
  <text
    x="50%"
    y="50%"
    text-anchor="middle"
    dominant-baseline="middle"
    class="hand"
    font-size="52"
    font-weight="700"
    fill="url(#textGradient)"
    filter="url(#softGlow)"
    transform="rotate(-4 450 160)"
  >
    <tspan x="50%" dy="-30">I'm Marcel.</tspan>
    <tspan x="50%" dy="64">Busy with anxiety</tspan>
  </text>
</svg>
